spring.application.name=csv-bulk-import

# PostgreSQL from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/csvimport
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# allow big uploads; the streaming importer never holds the whole file in memory
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.import.batch-size=1000
app.import.max-reported-errors=100
